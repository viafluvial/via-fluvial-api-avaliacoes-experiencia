spring:
  application:
    name: api-avaliacoes-experiencia
  profiles:
    default: dsv
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:db-avaliacoes-experiencia}
    username: ${DB_USERNAME:${DB_USER:avaliacoes-experiencia_app}}
    password: ${DB_PASSWORD:avaliacoes-experiencia_app}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        globally_quoted_identifiers: true
        default_schema: ${DB_SCHEMA:sc-avaliacoes-experiencia}
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:18000/realms/via-fluvial}
  mvc:
    problemdetails:
      enabled: true
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    urls:
      - name: OpenAPI Runtime
        url: /api/v1/v3/api-docs
      - name: OpenAPI Estatico
        url: /api/v1/openapi/openapi.yaml
    urls-primary-name: OpenAPI Runtime
evaluation:
  window-days: ${EVALUATION_WINDOW_DAYS:30}
integrations:
  service-token: ${INTEGRATIONS_SERVICE_TOKEN:}
  outbox:
    enabled: ${OUTBOX_ENABLED:false}
    delivery-url: ${OUTBOX_DELIVERY_URL:}
    interval-millis: ${OUTBOX_INTERVAL_MILLIS:5000}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
    allowed-methods: ${APP_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD}
    allowed-headers: ${APP_CORS_ALLOWED_HEADERS:*}
    exposed-headers: ${APP_CORS_EXPOSED_HEADERS:Location,X-Correlation-Id,WWW-Authenticate}
    allow-credentials: ${APP_CORS_ALLOW_CREDENTIALS:true}
    max-age: ${APP_CORS_MAX_AGE:3600}
    batch-size: ${OUTBOX_BATCH_SIZE:25}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:6}

---
spring:
  config:
    activate:
      on-profile: dsv
  flyway:
    locations: classpath:db/migration,classpath:db/seed/dsv
    out-of-order: true

---
spring:
  config:
    activate:
      on-profile: hml,prd