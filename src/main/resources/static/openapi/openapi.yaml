        ticketId: {type: string, format: uuid, description: Bilhete usado como evidencia de embarque.}
    EvaluationResponse:
      type: object
      required: [id, scores, manifestationType, status, verifiedTrip, anonymousPublicDisplay, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid, description: Identificador da avaliacao.}
