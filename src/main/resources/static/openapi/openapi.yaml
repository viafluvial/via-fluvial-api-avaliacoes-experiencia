      properties:
        id: {type: string, format: uuid, description: Identificador da avaliacao.}
        targetType: {$ref: '#/components/schemas/TargetType'}
        shipmentId: {type: string, format: uuid, description: Remessa avaliada.}
        boatmanId: {type: string, format: uuid, description: Barqueiro (transportador) avaliado.}
        raterUserId: {type: string, format: uuid, description: Usuario avaliador (contratante ou destinatario); nulo apos anonimizacao.}
        rating: {type: integer, minimum: 1, maximum: 5, description: Nota geral (media das tres notas arredondada meio para cima).}
        freightScores: {$ref: '#/components/schemas/FreightScores'}
