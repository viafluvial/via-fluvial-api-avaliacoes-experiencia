      allOf:
        - $ref: '#/components/schemas/RatingSummary'
        - type: object
          required: [submitted, published, rejected, underReview]
          properties:
            submitted: {type: integer, format: int64, minimum: 0}
            published: {type: integer, format: int64, minimum: 0}
