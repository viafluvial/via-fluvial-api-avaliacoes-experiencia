        tags: {type: array, items: {type: string}, description: Codigos rapidos escolhidos.}
        status: {$ref: '#/components/schemas/EvaluationStatus'}
        moderationReason: {type: string, description: Motivo registrado na ultima decisao de moderacao (quando houver).}
        boatmanResponse: {type: string, description: Resposta publica do transportador (quando houver).}
        createdAt: {type: string, format: date-time, description: Instante de criacao.}
        updatedAt: {type: string, format: date-time, description: Ultima alteracao (moderacao, resposta ou contestacao).}
    FreightEvaluationPage:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/FreightEvaluationItem'}}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1}
        totalElements: {type: integer, format: int64, minimum: 0}
        totalPages: {type: integer, minimum: 0}
    BoatmanSummaryItem:
      type: object
      required: [boatmanId, averageRating, verifiedEvaluationCount, sampleSufficient]
      properties:
        boatmanId: {type: string, format: uuid, description: Identificador do barqueiro.}
        averageRating: {type: number, format: double, minimum: 0, maximum: 5, description: Media geral publicada.}
        verifiedEvaluationCount: {type: integer, format: int64, minimum: 0, description: Total verificado publicado.}
        sampleSufficient: {type: boolean, description: Indica volume minimo para exposicao publica.}
    BoatmanSummaryList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/BoatmanSummaryItem'}
    Testimonial:
      type: object
      required: [evaluationId, rating, comment, publishedAt]
      properties:
        evaluationId: {type: string, format: uuid, description: Identificador da avaliacao.}
        rating: {type: integer, minimum: 1, maximum: 5, description: Nota geral.}
        comment: {type: string, description: Comentario publicado.}
        publishedAt: {type: string, format: date-time, description: Data da ultima atualizacao publicada.}
        tags:
          type: array
          description: Marcadores escolhidos pelo passageiro.
          items: {type: string}
    TestimonialList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/Testimonial'}
    RatingSummary:
      type: object
      required: [averageRating, verifiedEvaluationCount, distribution, sampleSufficient]
      properties:
        targetType:
          $ref: '#/components/schemas/TargetType'
        criteria:
          description: Medias por criterio (somente resumo FREIGHT).
