        freightScores:
          description: Notas do frete (somente FREIGHT).
          $ref: '#/components/schemas/FreightScores'
          x-field-extra-annotation: '@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)'
        boatmanId: {type: string, format: uuid, description: Barqueiro resolvido da viagem.}
        vesselId: {type: string, format: uuid, description: Embarcacao resolvida da viagem.}
        routeId: {type: string, format: uuid, description: Rota resolvida da viagem.}
        scores: {$ref: '#/components/schemas/Scores'}
        npsScore: {type: integer, minimum: 0, maximum: 10}
        manifestationType: {$ref: '#/components/schemas/ManifestationType'}
        comment: {type: string, description: Comentario sanitizado conforme visibilidade.}
        tags: {type: array, items: {type: string}}
        status: {$ref: '#/components/schemas/EvaluationStatus'}
        verifiedTrip: {type: boolean, description: Evidencia de participacao confirmada (embarque na viagem ou entrega do frete).}
        anonymousPublicDisplay: {type: boolean, description: Preferencia de exibicao publica.}
        boatmanResponse: {type: string, description: Resposta publica do barqueiro.}
        moderationReason: {type: string, description: Motivo visivel ao ator autorizado.}
        createdAt: {type: string, format: date-time, description: Instante de criacao.}
        updatedAt: {type: string, format: date-time, description: Ultima alteracao.}
    EvaluationPage:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/EvaluationResponse'}}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1}
        totalElements: {type: integer, format: int64, minimum: 0}
        totalPages: {type: integer, minimum: 0}
