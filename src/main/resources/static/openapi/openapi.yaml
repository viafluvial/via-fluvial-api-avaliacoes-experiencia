        reasonCode: {type: string, description: Codigo estavel da decisao, example: ELIGIBLE}
        alreadyEvaluated: {type: boolean, description: Indica avaliacao ativa existente.}
        eligibleUntil: {type: string, format: date-time, description: Fim da janela de avaliacao.}
