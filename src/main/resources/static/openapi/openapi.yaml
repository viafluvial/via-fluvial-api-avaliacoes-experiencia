          x-field-extra-annotation: '@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)'
        averageRating: {type: number, format: double, minimum: 0, maximum: 5, description: Media geral publicada.}
        verifiedEvaluationCount: {type: integer, format: int64, minimum: 0, description: Total verificado publicado.}
        nps: {type: number, format: double, minimum: -100, maximum: 100, description: Net Promoter Score.}
