openapi: 3.1.0
info:
  title: api-avaliacoes-experiencia
  version: 1.0.0
  description: API responsavel por avaliacoes e experiencia, incluindo coleta de feedback pos-viagem, moderacao e indicadores de satisfacao.
servers:
  - url: /avaliacoes-experiencia/api/v1
    description: Entrypoint padrao no API Gateway (Gravitee).
  - url: https://api-avaliacoes-experiencia.hml.viafluvial.com.br/api/v1
    description: Runtime de Homologacao
  - url: https://api-avaliacoes-experiencia.prd.viafluvial.com.br/api/v1
    description: Runtime de Producao
security:
  - bearerAuth: []
tags:
  - name: Passenger Evaluations
    description: Elegibilidade e avaliacoes do passageiro autenticado.
  - name: Boatman Experience
    description: Reputacao, respostas e contestacoes do barqueiro autenticado.
  - name: Evaluation Moderation
    description: Moderacao e indicadores administrativos.
  - name: Experience Events
    description: Eventos internos idempotentes do ciclo de viagem e do frete entregue.
  - name: Freight Evaluations
    description: Avaliacoes de frete (targetType FREIGHT) registradas pela api-fretes-cargas em nome do contratante ou destinatario.
paths:
  /avaliacoes-experiencia/elegibilidade/viagens/{tripId}:
    get:
      tags: [Passenger Evaluations]
      operationId: getTripEvaluationEligibility
      summary: Consultar elegibilidade da viagem
      description: Confirma viagem concluida, reserva do passageiro e evidencia de embarque.
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: Resultado da elegibilidade.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EligibilityResponse'}
        '503': {$ref: '#/components/responses/ProblemResponse'}
  /avaliacoes-experiencia/avaliacoes:
    post:
      tags: [Passenger Evaluations]
      operationId: createEvaluation
      summary: Enviar avaliacao verificada
      description: Cria uma unica avaliacao para o passageiro autenticado e a viagem comprovada.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateEvaluationRequest'}
      responses:
        '201':
          description: Avaliacao criada.
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EvaluationResponse'}
        '409': {$ref: '#/components/responses/ProblemResponse'}
        '422': {$ref: '#/components/responses/ProblemResponse'}
  /avaliacoes-experiencia/avaliacoes/minhas:
    get:
      tags: [Passenger Evaluations]
      operationId: listMyEvaluations
      summary: Listar minhas avaliacoes
      description: Retorna apenas avaliacoes pertencentes ao passageiro autenticado.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: status
          in: query
          description: Filtra pelo estado atual.
          schema: {$ref: '#/components/schemas/EvaluationStatus'}
      responses:
        '200':
          description: Pagina de avaliacoes do passageiro.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EvaluationPage'}
  /avaliacoes-experiencia/avaliacoes/{evaluationId}:
    parameters:
      - $ref: '#/components/parameters/EvaluationId'
    get:
      tags: [Passenger Evaluations]
      operationId: getEvaluation
      summary: Consultar avaliacao
      description: Retorna o recurso somente ao proprietario ou papel autorizado.
      responses:
        '200':
          description: Detalhe da avaliacao.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EvaluationResponse'}
        '404': {$ref: '#/components/responses/ProblemResponse'}
    patch:
      tags: [Passenger Evaluations]
      operationId: updateEvaluation
      summary: Atualizar avaliacao
      description: Atualiza conteudo dentro da janela e estados permitidos.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateEvaluationRequest'}
      responses:
        '200':
          description: Avaliacao atualizada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EvaluationResponse'}
        '409': {$ref: '#/components/responses/ProblemResponse'}
  /avaliacoes-experiencia/avaliacoes/{evaluationId}/denuncias:
    post:
      tags: [Passenger Evaluations]
      operationId: reportEvaluation
      summary: Denunciar avaliacao ou resposta
      description: Registra denuncia auditavel para revisao administrativa.
      parameters:
        - $ref: '#/components/parameters/EvaluationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReasonRequest'}
      responses:
        '201':
          description: Denuncia registrada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandResponse'}
  /avaliacoes-experiencia/avaliacoes/{evaluationId}/anonimizar:
    post:
      tags: [Passenger Evaluations]
      operationId: anonymizeEvaluation
      summary: Anonimizar avaliacao
      description: Remove identificadores pessoais preservando trilha minima e agregados permitidos.
      parameters:
        - $ref: '#/components/parameters/EvaluationId'
      responses:
        '200':
          description: Avaliacao anonimizada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EvaluationResponse'}
  /avaliacoes-experiencia/barqueiros/me/resumo:
    get:
      tags: [Boatman Experience]
      operationId: getMyBoatmanSummary
      summary: Consultar minha reputacao
      description: Agrega somente avaliacoes verificadas publicadas do barqueiro autenticado, do tipo informado (padrao TRIP).
      parameters:
        - $ref: '#/components/parameters/TargetTypeQuery'
      responses:
        '200':
          description: Resumo de reputacao.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RatingSummary'}
  /avaliacoes-experiencia/barqueiros/me/avaliacoes:
    get:
      tags: [Boatman Experience]
      operationId: listMyBoatmanEvaluations
      summary: Listar avaliacoes recebidas
      description: Lista comentarios publicados sem identidade privada do passageiro, do tipo informado (padrao TRIP).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/TargetTypeQuery'
      responses:
        '200':
          description: Pagina de avaliacoes publicadas.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EvaluationPage'}
  /avaliacoes-experiencia/barqueiros/{boatmanId}/resumo:
    get:
      tags: [Boatman Experience]
      operationId: getBoatmanSummary
      summary: Consultar reputacao publica
      description: |-
        Retorna agregado sem PII quando houver amostra minima. `targetType` (padrao TRIP) separa reputacao de viagens
        e de fretes; avaliacoes FREIGHT nunca entram no agregado TRIP. O resumo FREIGHT inclui `criteria` com as medias
        de pontualidade, cuidado com a carga e atendimento.
      security: []
      parameters:
        - name: boatmanId
          in: path
          required: true
          description: Identificador do barqueiro.
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/TargetTypeQuery'
      responses:
        '200':
          description: Resumo publico.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RatingSummary'}
  /avaliacoes-experiencia/barqueiros/resumos:
    get:
      tags: [Boatman Experience]
      operationId: listBoatmanSummaries
      summary: Consultar reputacao publica de varios barqueiros
      description: Retorna media e quantidade de avaliacoes publicadas por barqueiro, sem PII, para vitrines.
      security: []
      parameters:
        - name: ids
          in: query
          required: true
          description: Identificadores dos barqueiros separados por virgula (maximo 50).
          style: form
          explode: false
          schema:
            type: array
            maxItems: 50
            items: {type: string, format: uuid}
      responses:
        '200':
          description: Resumos publicos.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BoatmanSummaryList'}
  /avaliacoes-experiencia/depoimentos:
    get:
      tags: [Boatman Experience]
      operationId: listPublicTestimonials
      summary: Listar depoimentos publicados
      description: Comentarios de avaliacoes verificadas e publicadas pela moderacao, sem identificar o passageiro.
      security: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Quantidade maxima de depoimentos.
          schema: {type: integer, minimum: 1, maximum: 12, default: 6}
      responses:
        '200':
          description: Depoimentos publicos.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TestimonialList'}
  /avaliacoes-experiencia/avaliacoes/{evaluationId}/resposta:
    post:
      tags: [Boatman Experience]
      operationId: respondToEvaluation
      summary: Responder avaliacao publicada
      description: |-
        Permite uma resposta do barqueiro relacionado a avaliacao (viagem ou frete), somente quando publicada.
        GESTOR: o barqueiro e o usuario autenticado (comportamento original). SERVICE (ex.: api-fretes-cargas em nome
        do gestor): o barqueiro e informado em `X-Boatman-Id` (obrigatorio para SERVICE).
      parameters:
        - $ref: '#/components/parameters/EvaluationId'
        - name: X-Boatman-Id
          in: header
          required: false
          description: Barqueiro em nome de quem a resposta e registrada (obrigatorio quando o chamador e SERVICE).
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MessageRequest'}
      responses:
        '201':
          description: Resposta criada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandResponse'}
        '400': {$ref: '#/components/responses/ProblemResponse'}
        '409': {$ref: '#/components/responses/ProblemResponse'}
  /avaliacoes-experiencia/avaliacoes/{evaluationId}/contestacoes:
    post:
      tags: [Boatman Experience]
      operationId: contestEvaluation
      summary: Contestar avaliacao
      description: Abre contestacao auditavel sem alterar a nota original.
      parameters:
        - $ref: '#/components/parameters/EvaluationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReasonRequest'}
      responses:
        '201':
          description: Contestacao criada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandResponse'}
  /avaliacoes-experiencia/admin/avaliacoes:
    get:
      tags: [Evaluation Moderation]
      operationId: listEvaluationsForModeration
      summary: Listar fila de moderacao
      description: Lista avaliacoes com filtros operacionais sem busca por PII.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: status
          in: query
          description: Estado da fila.
          schema: {$ref: '#/components/schemas/EvaluationStatus'}
        - name: rating
          in: query
          description: Nota geral entre 1 e 5.
          schema: {type: integer, minimum: 1, maximum: 5}
        - name: targetType
          in: query
          required: false
          description: Filtra pelo tipo avaliado; sem filtro lista viagens e fretes.
          schema: {$ref: '#/components/schemas/TargetType'}
      responses:
        '200':
          description: Pagina de moderacao.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EvaluationPage'}
  /avaliacoes-experiencia/admin/avaliacoes/{evaluationId}:
    get:
      tags: [Evaluation Moderation]
      operationId: getEvaluationForModeration
      summary: Consultar item de moderacao
      description: Retorna detalhe e sinais operacionais a papel administrativo.
      parameters:
        - $ref: '#/components/parameters/EvaluationId'
      responses:
        '200':
          description: Detalhe administrativo.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EvaluationResponse'}
  /avaliacoes-experiencia/admin/avaliacoes/{evaluationId}/aprovar:
    post:
      tags: [Evaluation Moderation]
      operationId: approveEvaluation
      summary: Aprovar avaliacao
      description: Publica comentario e registra decisao, ator e instante.
      parameters:
        - $ref: '#/components/parameters/EvaluationId'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReasonRequest'}
      responses:
        '200':
          description: Avaliacao publicada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EvaluationResponse'}
  /avaliacoes-experiencia/admin/avaliacoes/{evaluationId}/rejeitar:
    post:
      tags: [Evaluation Moderation]
      operationId: rejectEvaluation
      summary: Rejeitar avaliacao
      description: Rejeita publicacao com motivo obrigatorio e preserva auditoria.
      parameters:
        - $ref: '#/components/parameters/EvaluationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReasonRequest'}
      responses:
        '200':
          description: Avaliacao rejeitada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EvaluationResponse'}
  /avaliacoes-experiencia/admin/contestacoes/{contestId}/resolver:
    post:
      tags: [Evaluation Moderation]
      operationId: resolveContest
      summary: Resolver contestacao
      description: Registra decisao administrativa sem apagar o historico.
      parameters:
        - name: contestId
          in: path
          required: true
          description: Identificador da contestacao.
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ContestResolutionRequest'}
      responses:
        '200':
          description: Contestacao resolvida.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandResponse'}
  /avaliacoes-experiencia/admin/indicadores:
    get:
      tags: [Evaluation Moderation]
      operationId: getExperienceIndicators
      summary: Consultar indicadores
      description: Retorna satisfacao, NPS, volume e distribuicao do periodo.
      responses:
        '200':
          description: Indicadores consolidados.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExperienceIndicators'}
  /avaliacoes-experiencia/internal/eventos/viagem-concluida:
    post:
      tags: [Experience Events]
      operationId: receiveTripCompleted
      summary: Receber conclusao de viagem
      description: Registra evento idempotente para convite e reconciliacao de elegibilidade.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TripCompletedEvent'}
      responses:
        '202':
          description: Evento aceito ou ja processado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandResponse'}
  /avaliacoes-experiencia/internal/eventos/frete-entregue:
    post:
      tags: [Experience Events]
      operationId: receiveFreightDelivered
      summary: Receber frete entregue
      description: |-
        Evento freight.delivered da api-fretes-cargas (somente SERVICE). Registra a elegibilidade de avaliacao da remessa
        com janela de 30 dias (expiresAt = deliveredAt + 30 dias). Idempotente por eventId (processed_event): repeticoes
        respondem 202 EVENT_ALREADY_PROCESSED. Uma remessa mantem a janela do primeiro evento de entrega.
      x-roles: [SERVICE]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FreightDeliveredEvent'}
      responses:
        '202':
          description: Evento aceito (EVENT_ACCEPTED) ou ja processado (EVENT_ALREADY_PROCESSED).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandResponse'}
        '400': {$ref: '#/components/responses/ProblemResponse'}
        '403': {$ref: '#/components/responses/ProblemResponse'}
  /avaliacoes-experiencia/internal/avaliacoes-frete:
    get:
      tags: [Freight Evaluations]
      operationId: listFreightEvaluations
      summary: Listar avaliacoes de frete
      description: |-
        Leitura interna (somente SERVICE, ex.: api-fretes-cargas espelhando a moderacao) das avaliacoes de frete
        (targetType FREIGHT), em qualquer estado de moderacao, ordenadas da mais recente para a mais antiga
        (createdAt desc, id desc). Avaliacoes de viagem (TRIP) nunca sao retornadas. Filtros opcionais por barqueiro
        (`boatmanId`) e estado de moderacao (`status`). `boatmanId` fora do formato UUID, `status` desconhecido,
        `page` negativa ou `size` fora de 1..100 respondem 400.
      x-roles: [SERVICE]
      parameters:
        - name: boatmanId
          in: query
          required: false
          description: Filtra pelo barqueiro (transportador) avaliado.
          schema: {type: string, format: uuid}
        - name: status
          in: query
          required: false
          description: Filtra pelo estado de moderacao atual.
          schema: {$ref: '#/components/schemas/EvaluationStatus'}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Pagina de avaliacoes de frete.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FreightEvaluationPage'}
        '400': {$ref: '#/components/responses/ProblemResponse'}
        '403': {$ref: '#/components/responses/ProblemResponse'}
    post:
      tags: [Freight Evaluations]
      operationId: createFreightEvaluation
      summary: Registrar avaliacao de frete
      description: |-
        Chamado pela api-fretes-cargas (somente SERVICE) em nome do contratante ou do destinatario de uma remessa entregue.
        Valida a elegibilidade registrada por frete-entregue: remessa entregue (422 SHIPMENT_NOT_DELIVERED), ate 30 dias
        (422 EVALUATION_WINDOW_EXPIRED), barqueiro da remessa (422 BOATMAN_MISMATCH), avaliador conforme raterRole
        (422 NOT_PARTICIPANT) e uma avaliacao por remessa e pessoa (409 ALREADY_EVALUATED). A mesma idempotencyKey
        (corpo ou cabecalho Idempotency-Key) devolve a mesma avaliacao; reutiliza-la para outra remessa responde
        409 IDEMPOTENCY_KEY_REUSED. A nota geral (scores.overall) e a media das tres notas arredondada (meio para cima).
        A avaliacao segue o fluxo de moderacao existente (SUBMITTED/UNDER_REVIEW ate aprovacao).
      x-roles: [SERVICE]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateFreightEvaluationRequest'}
      responses:
        '201':
          description: Avaliacao de frete registrada (ou devolvida pela mesma chave de idempotencia).
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EvaluationResponse'}
        '400': {$ref: '#/components/responses/ProblemResponse'}
        '403': {$ref: '#/components/responses/ProblemResponse'}
        '409': {$ref: '#/components/responses/ProblemResponse'}
        '422': {$ref: '#/components/responses/ProblemResponse'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TripId:
      name: tripId
      in: path
      required: true
      description: Identificador da viagem.
      schema: {type: string, format: uuid}
    EvaluationId:
      name: evaluationId
      in: path
      required: true
      description: Identificador da avaliacao.
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Chave unica para repeticao segura do comando.
      schema: {type: string, minLength: 8, maxLength: 100}
    Page:
      name: page
      in: query
      description: Pagina baseada em zero.
      schema: {type: integer, minimum: 0, default: 0}
    Size:
      name: size
      in: query
      description: Quantidade por pagina.
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    TargetTypeQuery:
      name: targetType
      in: query
      required: false
      description: Tipo avaliado (TRIP viagem, FREIGHT frete). Padrao TRIP, que preserva o comportamento original.
      schema:
        $ref: '#/components/schemas/TargetType'
        default: TRIP
  responses:
    ProblemResponse:
      description: Erro no formato RFC 7807.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    EvaluationStatus:
      type: string
      description: Estado auditavel da avaliacao.
      enum: [SUBMITTED, UNDER_REVIEW, PUBLISHED, REJECTED, CONTESTED, ANONYMIZED]
    TargetType:
      type: string
      description: Tipo avaliado. TRIP (viagem, padrao) ou FREIGHT (frete entregue).
      enum: [TRIP, FREIGHT]
    RaterRole:
      type: string
      description: Participacao do avaliador na remessa.
      enum: [CONTRATANTE, DESTINATARIO]
    FreightScores:
      type: object
      description: Notas do frete (1 a 5).
      required: [punctuality, cargoCare, service]
      properties:
        punctuality: {type: integer, minimum: 1, maximum: 5, description: Pontualidade, example: 5}
        cargoCare: {type: integer, minimum: 1, maximum: 5, description: Cuidado com a carga, example: 4}
        service: {type: integer, minimum: 1, maximum: 5, description: Atendimento, example: 5}
    FreightCriteriaAverages:
      type: object
      description: Medias dos criterios do frete nas avaliacoes FREIGHT publicadas (nulas sem avaliacoes).
      properties:
        punctuality: {type: number, format: double, minimum: 1, maximum: 5}
        cargoCare: {type: number, format: double, minimum: 1, maximum: 5}
        service: {type: number, format: double, minimum: 1, maximum: 5}
    FreightDeliveredEvent:
      type: object
      required: [eventId, shipmentId, boatmanId, contractorUserId, deliveredAt]
      properties:
        eventId: {type: string, format: uuid, description: Identificador idempotente do evento.}
        shipmentId: {type: string, format: uuid, description: Remessa entregue.}
        boatmanId: {type: string, format: uuid, description: Barqueiro (transportador) da remessa.}
        contractorUserId: {type: string, format: uuid, description: Usuario contratante.}
        recipientUserId: {type: string, format: uuid, description: Usuario destinatario (quando cadastrado).}
        deliveredAt: {type: string, format: date-time, description: Instante da entrega.}
    CreateFreightEvaluationRequest:
      type: object
      required: [shipmentId, boatmanId, raterUserId, raterRole, punctuality, cargoCare, service]
      properties:
        shipmentId: {type: string, format: uuid, description: Remessa entregue.}
        boatmanId: {type: string, format: uuid, description: Barqueiro avaliado; deve ser o da remessa.}
        raterUserId: {type: string, format: uuid, description: Usuario avaliador (contratante ou destinatario).}
        raterRole: {$ref: '#/components/schemas/RaterRole'}
        punctuality: {type: integer, minimum: 1, maximum: 5, description: Pontualidade.}
        cargoCare: {type: integer, minimum: 1, maximum: 5, description: Cuidado com a carga.}
        service: {type: integer, minimum: 1, maximum: 5, description: Atendimento.}
        tags:
          type: array
          maxItems: 10
          description: Codigos rapidos (duplicados sao ignorados).
          items: {type: string, pattern: '^[A-Z0-9_]{2,40}$'}
        comment: {type: string, maxLength: 1000, description: Comentario publico sem dados pessoais.}
        idempotencyKey: {type: string, minLength: 1, maxLength: 100, description: Chave de idempotencia da avaliacao.}
    ManifestationType:
      type: string
      description: Natureza declarada do feedback.
      enum: [COMPLIMENT, SUGGESTION, COMPLAINT, SAFETY_REPORT]
    Scores:
      type: object
      description: Notas por dimensao da experiencia.
      required: [overall]
      properties:
        overall: {type: integer, minimum: 1, maximum: 5, description: Nota geral, example: 5}
        platform: {type: integer, minimum: 1, maximum: 5, description: Experiencia na plataforma, example: 4}
        boatman: {type: integer, minimum: 1, maximum: 5, description: Atendimento do barqueiro, example: 5}
        vessel: {type: integer, minimum: 1, maximum: 5, description: Qualidade da embarcacao, example: 4}
        route: {type: integer, minimum: 1, maximum: 5, description: Experiencia no trajeto, example: 4}
        boarding: {type: integer, minimum: 1, maximum: 5, description: Embarque e organizacao, example: 3}
        service: {type: integer, minimum: 1, maximum: 5, description: Atendimento e suporte, example: 5}
    CreateEvaluationRequest:
      type: object
      required: [tripId, scores, manifestationType, anonymousPublicDisplay]
      properties:
        tripId: {type: string, format: uuid, description: Viagem concluida, example: 34ad4a17-9857-4c7b-846e-c0e48a9b3398}
        scores: {$ref: '#/components/schemas/Scores'}
        npsScore: {type: integer, minimum: 0, maximum: 10, description: Probabilidade de recomendacao, example: 9}
        manifestationType: {$ref: '#/components/schemas/ManifestationType'}
        comment: {type: string, maxLength: 1000, description: Comentario sem dados pessoais, example: Embarque organizado e equipe atenciosa.}
        tags:
          type: array
